<!DOCTYPE html>
<html lang="fr">
<head>
    {{> head}}
    <script type="application/ld+json">{{{jsonLd}}}</script>
</head>
<body class="scanlines page-flex">
    {{> nav}}

    <div id="yt-modal" role="dialog" aria-modal="true" aria-label="Lecture de la vidéo">
        <div class="modal-inner">
            <button class="close-btn" id="modal-close" aria-label="Fermer la vidéo"><span class="material-icons" style="font-size:2rem;">close</span></button>
            <iframe id="yt-iframe" src="" title="Vidéo BLACKSNOW" allow="autoplay; encrypted-media; picture-in-picture; web-share" allowfullscreen></iframe>
        </div>
    </div>

    <main id="performances" class="py-20 bg-black y2k-grid-bg border-t-2">
        <div class="container mx-auto px-6">
            <div class="text-center mb-16">
                <h1 class="text-4xl md:text-6xl font-bold mb-6 y2k-font pt-10">Nos vidéos</h1>
                <p class="text-xl text-gray-300 mt-6 max-w-2xl mx-auto">Découvrez nos performances filmées</p>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8" id="video-grid">
                {{{cards}}}
            </div>
            <div class="text-center mt-16">
                <a href="https://www.youtube.com/@blacksnow_dancecrew" target="_blank" rel="noopener" class="y2k-btn">
                    <span class="material-icons" aria-hidden="true">ondemand_video</span> PLUS DE VIDÉOS SUR YOUTUBE
                </a>
            </div>
        </div>
    </main>

    {{> footer}}
    <script src="/js/videos.js?v={{v}}" defer></script>
</body>
</html>
