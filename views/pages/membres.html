<!DOCTYPE html>
<html lang="fr">
<head>
    {{> head}}
</head>
<body class="scanlines page-flex">
    {{> nav}}

    <main id="members" class="py-20 bg-black y2k-grid-bg border-t-2">
        <div class="container mx-auto px-6">
            <div class="text-center mb-16">
                <h1 class="text-4xl md:text-6xl font-bold mb-6 y2k-font pt-10">Nos membres</h1>
                <p class="text-xl text-gray-300 mt-6 max-w-2xl mx-auto">Rencontrez les membres de BLACKSNOW. Cliquez sur une carte pour voir ses photos.</p>
            </div>

            <div id="members-container" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-6 p-6">
                {{{cards}}}
            </div>

            <div class="text-center mt-16">
                <a href="/contact" class="y2k-btn is-neon">
                    <i class="fas fa-user-plus mr-2" aria-hidden="true"></i> NOUS REJOINDRE
                </a>
            </div>
        </div>
    </main>

    <!-- Overlay galerie d'un membre -->
    <div id="gallery-overlay" class="gal-overlay" role="dialog" aria-modal="true" aria-labelledby="gal-title" hidden>
        <div class="gal-window">
            <div class="gal-titlebar">
                <span class="tb-dots" aria-hidden="true"><i></i><i></i><i></i></span>
                <span class="tb-name" id="gal-file"></span>
                <button type="button" class="gal-close" data-close aria-label="Fermer"><span class="material-icons">close</span></button>
            </div>
            <div class="gal-head">
                <img id="gal-avatar" class="gal-avatar" alt="">
                <div>
                    <h2 id="gal-title" class="gal-name"></h2>
                    <div class="gal-meta" id="gal-meta"></div>
                </div>
            </div>
            <div id="gal-grid" class="gal-grid"></div>
            <p id="gal-empty" class="gal-empty" hidden>Pas encore de photos ❅ Revenez bientôt !</p>
        </div>
    </div>

    <!-- Lightbox plein écran -->
    <div id="lightbox" class="lb" role="dialog" aria-modal="true" aria-label="Photo agrandie" hidden>
        <p id="lb-count" class="lb-count"></p>
        <button type="button" class="lb-btn lb-close" aria-label="Fermer"><span class="material-icons">close</span></button>
        <button type="button" class="lb-btn lb-prev" aria-label="Photo précédente"><span class="material-icons">chevron_left</span></button>
        <figure class="lb-fig">
            <img id="lb-img" alt="">
            <figcaption id="lb-cap"></figcaption>
        </figure>
        <button type="button" class="lb-btn lb-next" aria-label="Photo suivante"><span class="material-icons">chevron_right</span></button>
        <div class="lb-strip" id="lb-strip"></div>
    </div>

    {{> footer}}

    <script id="gallery-data" type="application/json">{{{galleryJson}}}</script>
    <script src="/js/membres.js?v={{v}}" defer></script>
</body>
</html>
