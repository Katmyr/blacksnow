    <div id="mobileMenu" class="mobile-menu" aria-hidden="true">

    <header class="site-header fixed w-full z-50">
        <div class="container mx-auto px-6 py-3">
            <div class="flex justify-between items-center">
                <a href="/" aria-label="BLACKSNOW, accueil"><img src="/logo.svg" class="logo-header" alt="BLACKSNOW" width="170" height="85"></a>
                <nav class="hidden md:flex items-center space-x-8" aria-label="Navigation principale">
                    <a href="/" class="text-white transition duration-300">ACCUEIL</a>
                    <a href="/membres" class="text-white transition duration-300">MEMBRES</a>

                    <a href="/videos" class="text-white transition duration-300">VIDÉOS</a>
                    <a href="/contact" class="y2k-btn sm">CONTACT</a>
                </nav>
                <button id="openMenu" class="md:hidden flex items-center justify-center text-white" aria-label="Ouvrir le menu" aria-controls="mobileMenu" aria-expanded="false">
                    <span class="material-icons" style="font-size:2rem;">menu</span>
                </button>
            </div>
        </div>
    </header>


    <main class="py-20 bg-black y2k-grid-bg border-t-2">
        <div class="mt-16 max-w-2xl mx-auto form p-8 rounded-lg border-2">
            <h1 class="text-3xl font-bold mb-6 text-center">CONTACTEZ-NOUS</h1>
            <form action="https://formspree.io/f/mwplyjzj" method="POST" id="contact-form" class="space-y-4">
                <div>
                    <label for="subject" class="block text-neon-blue mb-2">OBJET</label>
                    <select id="subject" name="subject" class="w-full px-4 py-3 bg-gray-900 border-2 rounded-lg focus:outline-none focus:border-neon-blue text-white">
                        <option value="">[Aucun objet]</option>
                        <option value="intégrer le groupe">Intégrer le groupe</option>
                        <option value="participation à un evenement">Demande de participation à un événement</option>
                    </select>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label for="first-name" class="block mb-2">PRÉNOM</label>
                        <input type="text" name="first-name" id="first-name" autocomplete="given-name" class="w-full px-4 py-3 bg-gray-900 border-2 rounded-lg focus:outline-none focus:border-neon-blue text-white" required>
                    </div>
                    <div>
                        <label for="last-name" class="block mb-2">NOM</label>
                        <input type="text" name="last-name" id="last-name" autocomplete="family-name" class="w-full px-4 py-3 bg-gray-900 border-2 rounded-lg focus:outline-none focus:border-neon-blue text-white">
                    </div>
                </div>
                <div>
                    <label for="email" class="block mb-2">EMAIL</label>
                    <input type="email" name="email" id="email" autocomplete="email" class="w-full px-4 py-3 bg-gray-900 border-2 rounded-lg focus:outline-none focus:border-neon-blue text-white" required>
                </div>
                <div>
                    <label for="tel" class="block mb-2">TÉLÉPHONE</label>
                    <input type="tel" name="tel" id="tel" autocomplete="tel" class="w-full px-4 py-3 bg-gray-900 border-2 rounded-lg focus:outline-none focus:border-neon-blue text-white">
                </div>
                <div>
                    <label for="message" class="block mb-2">MESSAGE</label>
                    <textarea id="message" name="message" rows="4" class="w-full px-4 py-3 bg-gray-900 border-2 rounded-lg focus:outline-none focus:border-neon-blue text-white" required></textarea>
                </div>
                <div class="pt-4">
                    <button type="submit" class="y2k-btn is-neon w-full">ENVOYER</button>
                </div>
            </form>
        </div>
    </main>

    <footer class="footer">

            <a href="https://www.tiktok.com/@blacksnow_dancecrew" target="_blank" rel="noopener" aria-label="TikTok" class="text-white hover:text-neon-blue transition"><i class="fab fa-tiktok" aria-hidden="true"></i></a>
            <a href="https://www.facebook.com/people/Black-Snow/100039859277194/" target="_blank" rel="noopener" aria-label="Facebook" class="text-white hover:text-neon-blue transition"><i class="fab fa-facebook" aria-hidden="true"></i></a>
        </div>
